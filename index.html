<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Ãmmädï ❤️</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    font-family:Arial,sans-serif;
    background:radial-gradient(circle at top,#ffb6d9,#ff5c9a 45%,#7b1748);
    color:white;
  }
  .card{
    width:min(90%,420px); padding:48px 28px; text-align:center;
    border:1px solid rgba(255,255,255,.35);
    border-radius:28px;
    background:rgba(255,255,255,.14);
    backdrop-filter:blur(12px);
    box-shadow:0 20px 60px rgba(0,0,0,.25);
    position:relative; z-index:2;
  }
  .heart{font-size:72px; animation:pulse 1.2s infinite}
  h1{font-size:42px;margin:12px 0 8px}
  p{font-size:24px;margin:0;line-height:1.5}
  .small{font-size:15px;margin-top:22px;opacity:.85}
  .float{
    position:absolute; bottom:-50px; font-size:25px;
    animation:up linear infinite; opacity:.8;
  }
  @keyframes pulse{50%{transform:scale(1.15)}}
  @keyframes up{to{transform:translateY(-115vh) rotate(360deg);opacity:0}}
</style>
</head>
<body>
<div class="card">
  <div class="heart">❤️</div>
  <h1>Ãmmädï</h1>
  <p>Miss You ❤️</p>
  <div class="small">Just a little surprise for you ✨</div>
</div>
<script>
const symbols=["❤️","💕","💖","✨","🌸"];
for(let i=0;i<28;i++){
  const s=document.createElement("div");
  s.className="float";
  s.textContent=symbols[Math.floor(Math.random()*symbols.length)];
  s.style.left=Math.random()*100+"vw";
  s.style.animationDuration=(5+Math.random()*6)+"s";
  s.style.animationDelay=(-Math.random()*8)+"s";
  document.body.appendChild(s);
}
</script>
</body>
</html>
